{% extends "base.html" %}
{% block title %}Admin Login – SKIT Portal{% endblock %}

{% block content %}
<div class="auth-page">
  <div class="auth-card fadein">
    <div class="auth-head">
      <div class="ico ico-ind" style="margin:0 auto 1rem">🏛️</div>
      <h2>Admin Login</h2>
      <p>Examination administration portal</p>
    </div>

    <form method="POST" action="{{ url_for('admin_login') }}">
      <div class="form-group">
        <label>Username</label>
        <input type="text" name="username" placeholder="admin" required autocomplete="off">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn btn-indigo" style="width:100%;margin-top:.5rem">Login →</button>
    </form>

    <p class="back-link"><a href="{{ url_for('index') }}">← Back to Home</a></p>
  </div>
</div>
{% endblock %}
